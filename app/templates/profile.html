{% extends "base.html" %}
{% block content %}
<h1>User profile</h1>
<form method="post">
  <label>Full name <input name="full_name" value="{{ profile.full_name or '' }}"></label>
  <label>Name at birth <input name="name_at_birth" value="{{ profile.name_at_birth or '' }}"></label>
  <label>Date of birth <input type="date" name="date_of_birth" value="{{ profile.date_of_birth or '' }}"></label>
  <label>Place of birth <input name="place_of_birth" value="{{ profile.place_of_birth or '' }}"></label>
  <label>Gender
    <select name="gender">
      <option value="">--</option>
      {% for g in genders %}
      <option value="{{ g.value }}" {% if profile.gender and profile.gender.value == g.value %}selected{% endif %}>{{ g.value }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Mother's maiden name <input name="mothers_maiden_name" value="{{ profile.mothers_maiden_name or '' }}"></label>
  <label>Citizenship(s) <input name="citizenships" value="{{ profile.citizenships or '' }}"></label>
  <label>Social security number (9 digits) <input name="social_security_number" value="{{ profile.social_security_number or '' }}"></label>
  <label>Tax number (10 digits) <input name="tax_number" value="{{ profile.tax_number or '' }}"></label>
  <label>Education number (11 digits) <input name="education_number" value="{{ profile.education_number or '' }}"></label>
  <label>Teacher ID card number <input name="teacher_id_card_number" value="{{ profile.teacher_id_card_number or '' }}"></label>
  <label>Permanent residence <textarea name="permanent_residence">{{ profile.permanent_residence or '' }}</textarea></label>
  <label>Temporary address <textarea name="temporary_address">{{ profile.temporary_address or '' }}</textarea></label>
  <label>Phone number <input name="phone_number" value="{{ profile.phone_number or '' }}"></label>
  <label>Bank account number <input name="bank_account_number" value="{{ profile.bank_account_number or '' }}"></label>
  <label>Marital status <input name="marital_status" value="{{ profile.marital_status or '' }}"></label>
  <label>Disability <input name="disability" value="{{ profile.disability or '' }}"></label>
  <button type="submit">Save profile</button>
</form>
{% endblock %}
